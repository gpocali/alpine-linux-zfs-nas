<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alpine ZFS Vault Dashboard</title>
    <style>
        /* Base Dark Mode Styling */
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: #121212;
            color: #e0e0e0;
            padding: 20px;
            max-width: 1100px;
            margin: 0 auto;
        }
        h1 { color: #ffffff; border-bottom: 2px solid #333; padding-bottom: 10px; margin-bottom: 30px; }
        h2 { color: #f8f9fa; font-size: 1.3em; margin-top: 0; margin-bottom: 15px; letter-spacing: 0.5px; }

        /* Section Layouts */
        .section-title { font-size: 1.1em; color: #868e96; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 15px; font-weight: bold; }
        .grid-container { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 20px; margin-bottom: 35px; }

        /* Pool & Dataset Cards */
        .telemetry-card {
            background: #1e1e1e;
            border-radius: 8px;
            padding: 20px;
            border: 1px solid #333;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #333;
            padding-bottom: 10px;
            margin-bottom: 15px;
        }
        .card-title { font-size: 1.3em; font-weight: bold; color: #4dabf7; font-family: monospace; }

	/* Nested Disk Grid */
        .disk-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 12px;
            margin-top: 15px;
            padding-top: 15px;
            border-top: 1px solid #2b2c30;
        }
        .disk-card {
            background: #25262b;
            padding: 8px 12px;
            border-radius: 6px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-left: 3px solid #444;
        }
        .state-Active { border-left-color: #2f9e44; }
        .state-Standby { border-left-color: #5c5c5c; opacity: 0.7; }
        .disk-id { font-family: monospace; font-size: 0.9em; color: #ced4da; }
        .disk-state { font-size: 0.9em; font-weight: bold; }

        /* Health Badges */
        .health-badge { padding: 4px 10px; border-radius: 4px; font-weight: bold; font-size: 0.85em; text-transform: uppercase; }
        .health-ONLINE { background: #2f9e44; color: #fff; }
        .health-DEGRADED { background: #f59f00; color: #fff; }
        .health-FAULTED { background: #e03131; color: #fff; }

        /* Progress Bars */
        .stat-label { display: flex; justify-content: space-between; font-size: 0.9em; color: #ced4da; margin-bottom: 5px; }
        .stat-value { font-family: monospace; font-weight: bold; color: #ffffff; }
        .bar-bg {
            background: #333;
            border-radius: 4px;
            height: 14px;
            width: 100%;
            margin-bottom: 15px;
            overflow: hidden;
        }
        .bar-fill {
            background: #4dabf7;
            height: 100%;
            transition: width 0.5s ease-in-out;
        }
        .bar-fill.warning { background: #f59f00; }
        .bar-fill.critical { background: #e03131; }

        /* Meta Badges Grid */
        .meta-grid { display: flex; flex-wrap: wrap; gap: 8px; margin-top: auto; padding-top: 10px; border-top: 1px solid #2b2c30; }
        .meta-badge {
            background: #25262b;
            border: 1px solid #383a40;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 0.8em;
            font-family: monospace;
            color: #a6a7ab;
        }
        .meta-badge strong { color: #f1f3f5; }
        .meta-badge.active-snap { border-color: #2f9e44; color: #40c057; }

        .timestamp { color: #888; font-size: 0.85em; text-align: right; margin-top: 40px; }
    </style>
</head>
<body>

    <h1>Storage Array Telemetry</h1>
    
    <div class="section-title">Physical Pool Infrastructure</div>
    <div class="grid-container" id="pools-container">
        <p style="color: #888;">Loading array configurations...</p>
    </div>

    <div class="section-title">ZFS Datasets & Logical Volumes</div>
    <div class="grid-container" id="datasets-container">
        <p style="color: #888;">Loading logical volumes...</p>
    </div>

    <div class="timestamp" id="last-updated"></div>

    <script>
        // Helper to parse human-readable ZFS capacities (e.g., 500G, 2.3T, 45M) into raw bytes for percentage bars
        function parseToBytes(sizeStr) {
            if (!sizeStr || sizeStr === 'none' || sizeStr === '-') return 0;
            const num = parseFloat(sizeStr);
            const unit = sizeStr.replace(/[0-9.]/g, '').trim().toUpperCase();
            if (unit.includes('T')) return num * 1024 * 1024 * 1024 * 1024;
            if (unit.includes('G')) return num * 1024 * 1024 * 1024;
            if (unit.includes('M')) return num * 1024 * 1024;
            if (unit.includes('K')) return num * 1024;
            return num;
        }

        async function fetchTelemetry() {
            try {
                // Fetch the output matching the new generation script filename
                const response = await fetch('zfs-telemetry.json?t=' + new Date().getTime());
                if (!response.ok) throw new Error("HTTP " + response.status);

                const data = await response.json();
                renderDashboard(data);

                document.getElementById('last-updated').innerText = "Telemetry synchronized: " + data.updated;
            } catch (error) {
                console.error("Telemetry fetch bottleneck:", error);
                const errorHtml = '<p style="color: #fa5252; grid-column: 1/-1;">⚠️ Telemetry stream offline. Verify the background compilation daemon is active.</p>';
                document.getElementById('pools-container').innerHTML = errorHtml;
                document.getElementById('datasets-container').innerHTML = errorHtml;
            }
        }

        function renderDashboard(data) {
            const poolsContainer = document.getElementById('pools-container');
            const datasetsContainer = document.getElementById('datasets-container');
            
            poolsContainer.innerHTML = '';
            datasetsContainer.innerHTML = '';

            // 1. Process and Render Pool Framework
            data.pools.forEach(pool => {
                const card = document.createElement('div');
                card.className = 'telemetry-card';

                const healthClass = pool.health === 'ONLINE' ? 'health-ONLINE' : (pool.health === 'DEGRADED' ? 'health-DEGRADED' : 'health-FAULTED');
                const cleanPct = parseFloat(pool.capacity.replace('%', ''));

                let barColorClass = '';
                if (cleanPct >= 90) barColorClass = 'critical';
                else if (cleanPct >= 75) barColorClass = 'warning';

                let html = `
                    <div class="card-header">
                        <span class="card-title">${pool.pool}</span>
                        <span class="health-badge ${healthClass}">${pool.health}</span>
                    </div>
                    <div>
                        <div class="stat-label"><span>Allocated / Size:</span><span class="stat-value">${pool.allocated} / ${pool.size}</span></div>
                        <div class="stat-label"><span>Free Space:</span><span class="stat-value">${pool.free}</span></div>
                        <div class="stat-label"><span>Pool Utilization:</span><span class="stat-value">${pool.capacity}</span></div>
                        <div class="bar-bg">
                            <div class="bar-fill ${barColorClass}" style="width: ${cleanPct}%;"></div>
                        </div>
                    </div>
                    <div class="disk-grid">
                `;

                // Loop through and build the child disk UI with Icons
                if (pool.disks && pool.disks.length > 0) {
                    pool.disks.forEach(disk => {
                        const stateClass = disk.state === 'Active' ? 'state-Active' : 'state-Standby';
                        const icon = disk.state === 'Active' ? '🟢' : '💤';
                        
                        html += `
                            <div class="disk-card ${stateClass}">
                                <span class="disk-id">${disk.id}</span>
                                <span class="disk-state">${icon} ${disk.state}</span>
                            </div>
                        `;
                    });
                } else {
                    html += `<span style="color:#666; font-size:0.9em;">No physical disks detected.</span>`;
                }

                html += `</div>`; // Close the disk-grid
                card.innerHTML = html;
                poolsContainer.appendChild(card);
            });

            // 2. Process and Render Dataset/Quota Allocations
            data.datasets.forEach(ds => {
                const card = document.createElement('div');
                card.className = 'telemetry-card';

                const usedBytes = parseToBytes(ds.used);
                const availBytes = parseToBytes(ds.available);
                const totalBytes = usedBytes + availBytes;
                
                let quotaBytes = parseToBytes(ds.quota);
                let usePct = 0;
                let barTitle = "Unbounded Allocation";

                // If a hard quota is set, calculate metrics against the quota ceiling instead of total pool availability
                if (quotaBytes > 0) {
                    usePct = (usedBytes / quotaBytes) * 100;
                    barTitle = `Quota Limit: ${ds.quota}`;
                } else {
                    usePct = (usedBytes / totalBytes) * 100;
                }
                
                if (usePct > 100) usePct = 100; // Cap bounds visually

                let barColorClass = '';
                if (quotaBytes > 0 && usePct >= 90) barColorClass = 'critical';
                else if (quotaBytes > 0 && usePct >= 75) barColorClass = 'warning';

		// Format metadata metrics safely
                const compRatio = ds.compression === '1.00x' ? 'None' : ds.compression;
                
                // Network Share Badge Logic
                const smbClass = ds.smb_state === 'Active' ? 'active-snap' : '';
                const smbText = ds.smb_state === 'Active' ? `SMB: <strong>${ds.smb_perm}</strong>` : `SMB: <strong>Offline</strong>`;

                // Snapshot Badge Logic
                const snapClass = ds.snap_freq !== 'Disabled' ? 'active-snap' : '';
                const snapText = ds.snap_freq !== 'Disabled' 
                    ? `Snap: <strong>${ds.snap_freq}</strong> (${ds.snap_retention}d)` 
                    : `Snap: <strong>Off</strong>`;

                card.innerHTML = `
                    <div class="card-header">
                        <span class="card-title" style="font-size:1.1em; color:#e0e0e0;">${ds.dataset}</span>
                    </div>
                    <div>
                        <div class="stat-label"><span>Space Consumed:</span><span class="stat-value">${ds.used}</span></div>
                        <div class="stat-label"><span>Available Block Space:</span><span class="stat-value">${ds.available}</span></div>
                        <div class="stat-label"><span>${barTitle}:</span><span class="stat-value">${quotaBytes > 0 ? Math.round(usePct) + '%' : 'Dynamic'}</span></div>
                        <div class="bar-bg">
                            <div class="bar-fill ${barColorClass}" style="width: ${usePct}%;"></div>
                        </div>
                    </div>
                    <div class="meta-grid">
                        <div class="meta-badge ${smbClass}">${smbText}</div>
                        <div class="meta-badge ${snapClass}">${snapText}</div>
                        <div class="meta-badge">Ratio: <strong>${compRatio}</strong></div>
                    </div>
                `;
                datasetsContainer.appendChild(card);
            });
        }

        // Initialize synchronization loops
        fetchTelemetry();
        setInterval(fetchTelemetry, 60000); // Aligned to the 1-minute resolution of your generator crontab
    </script>
</body>
</html>
